<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dtech IT - Book a Service</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/service.css" />
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="../../index.html" class="nav-logo">dtech <span>IT</span></a>
      <ul class="nav-links">
        <li><a href="../../index.html#about">About</a></li>
        <li><a href="../../index.html#services">Services</a></li>
        <li><a href="../../index.html#technologies">Technologies</a></li>
      </ul>
      <div class="nav-auth">
        <a href="../../index.html" class="btn-back">Back to Home</a>
        <a href="../login.html" class="btn-book">Log In</a>
      </div>
    </div>
  </nav>

  <section class="header-section">
    <div class="container">
      <p class="sub-label">BOOKING FORM</p>
      <h1>Book a <span>Service</span></h1>
      <p class="desc">
        Fill out the details below to schedule a project or consultation with our team.
      </p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="form-box">
        <form action="../../index.html" method="get">
          
          <div class="input-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required />
          </div>

          <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required />
          </div>

          <div class="input-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required />
          </div>

          <div class="input-group">
            <label for="service">Select Service</label>
            <select id="service" name="service" required>
              <option value="">-- Choose a Service --</option>
              <option value="web">Web Development</option>
              <option value="mobile">Mobile Apps</option>
              <option value="cloud">Cloud Solutions</option>
              <option value="cyber">Cybersecurity</option>
              <option value="ai">AI &amp; Automation</option>
              <option value="uiux">UI/UX Design</option>
            </select>
          </div>

          <div class="input-group">
            <label for="date">Preferred Date</label>
            <input type="date" id="date" name="date" required />
          </div>

          <div class="input-group">
            <label for="details">Project Details</label>
            <textarea id="details" name="details" rows="4" placeholder="Briefly describe what you need help with..." required></textarea>
          </div>

          <button type="submit" class="main-btn submit-btn">Submit Booking</button>
        </form>
      </div>
    </div>
  </section>

  <footer class="footer">
    <p>&copy; 2025 dtech IT. All rights reserved.</p>
  </footer>

</body>
</html>
